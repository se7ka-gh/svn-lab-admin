<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex">
  <title>SVN-LAB Admin</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { background-color: #0a0a0a; color: #e0e0e0; font-family: 'Inter', sans-serif; }
    .input-dark { background: #1a1a1a; border: 1px solid #333; color: #fff; padding: 8px; border-radius: 6px; width: 100%; }
    .input-dark:focus { border-color: #ff3e00; outline: none; }
    .btn-primary { background: #ff3e00; color: white; padding: 10px 20px; border-radius: 6px; font-weight: bold; cursor: pointer; border: none; }
    .btn-primary:hover { background: #e03600; }
    .btn-secondary { background: #333; color: white; padding: 8px 16px; border-radius: 6px; cursor: pointer; border: none; }
    .gallery-item { position: relative; display: inline-block; margin: 5px; background: #1a1a1a; padding: 5px; border-radius: 4px; }
    .gallery-item img { width: 100px; height: 100px; object-fit: cover; border-radius: 4px; display: block; }
    .gallery-item .remove-btn { position: absolute; top: -5px; right: -5px; background: red; color: white; border-radius: 50%; width: 20px; height: 20px; border: none; cursor: pointer; font-size: 12px; line-height: 20px; text-align: center; }
    .gallery-item .file-name { font-size: 10px; color: #888; max-width: 100px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; margin-top: 2px; }
  </style>
</head>
<body class="p-4 md:p-8 max-w-4xl mx-auto">

  <div id="login-screen" class="text-center mt-20">
    <h1 class="text-3xl font-bold mb-6 text-[#ff3e00]">SVN-LAB ADMIN</h1>
    <p class="mb-4 text-gray-400">Введите GitHub Personal Access Token для доступа</p>
    <input type="password" id="token-input" class="input-dark max-w-md mb-4 text-center" placeholder="github_pat_...">
    <br>
    <button onclick="saveToken()" class="btn-primary">Войти</button>
  </div>

  <div id="admin-screen" class="hidden">
    <div class="flex justify-between items-center mb-8 border-b border-gray-800 pb-4">
      <h1 class="text-2xl font-bold text-[#ff3e00]">Управление проектами</h1>
      <button onclick="logout()" class="text-sm text-gray-500 hover:text-white">Выйти</button>
    </div>

    <div id="loading" class="text-center py-10 text-gray-400">Загрузка данных из GitHub...</div>
    <div id="projects-container" class="space-y-8"></div>

    <div class="mt-8 flex gap-4">
      <button onclick="addNewProject()" class="btn-secondary">+ Добавить новый проект</button>
      <button onclick="saveAllChanges()" class="btn-primary text-lg px-8">💾 СОХРАНИТЬ ВСЁ В GITHUB</button>
    </div>
    <p id="status-msg" class="mt-4 text-center text-sm"></p>
  </div>

  <script>
    const REPO = 'se7ka-gh/svn-lab-site-qwen';
    const BRANCH = 'main';
    const BASE_URL = 'https://se7ka-gh.github.io/svn-lab-site-qwen';
    let token = localStorage.getItem('svn_token');
    let projectsData = [];

    if (token) {
      document.getElementById('login-screen').classList.add('hidden');
      document.getElementById('admin-screen').classList.remove('hidden');
      loadProjects();
    }

    function saveToken() {
      const input = document.getElementById('token-input').value.trim();
      if (input.startsWith('github_pat_')) {
        localStorage.setItem('svn_token', input);
        token = input;
        location.reload();
      } else {
        alert('Неверный формат токена');
      }
    }

    function logout() {
      localStorage.removeItem('svn_token');
      location.reload();
    }

    async function loadProjects() {
      try {
        const res = await fetch(`https://api.github.com/repos/${REPO}/contents/data/projects.json?ref=${BRANCH}`, {
          headers: { 'Authorization': `Bearer ${token}`, 'Accept': 'application/vnd.github.v3+json' }
        });
        if (!res.ok) throw new Error('Не удалось загрузить projects.json');
        const data = await res.json();
        
        const binaryString = atob(data.content);
        const bytes = new Uint8Array(binaryString.length);
        for (let i = 0; i < binaryString.length; i++) {
          bytes[i] = binaryString.charCodeAt(i);
        }
        const content = new TextDecoder('utf-8').decode(bytes);
        projectsData = JSON.parse(content);
        
        console.log('Загружено проектов:', projectsData.length);
        projectsData.forEach((p, i) => {
          console.log(`Проект ${i}: ${p.name}, галерея:`, p.gallery);
        });
        
        renderProjects();
      } catch (err) {
        document.getElementById('loading').innerText = 'Ошибка: ' + err.message;
        console.error(err);
      }
    }

    function renderProjects() {
      document.getElementById('loading').classList.add('hidden');
      const container = document.getElementById('projects-container');
      container.innerHTML = '';

      projectsData.forEach((proj, index) => {
        const div = document.createElement('div');
        div.className = 'bg-[#131519] p-6 rounded-lg border border-gray-800';
        
        // Рендер галереи — показываем и существующие фото
        let galleryHTML = '<div class="mt-3"><p class="text-xs text-gray-500 mb-2">Галерея (файлы):</p><div class="flex flex-wrap gap-2">';
        
        if (proj.gallery && proj.gallery.length > 0) {
          proj.gallery.forEach((imgPath, imgIdx) => {
            // Убираем ведущий слэш для отображения
            const fileName = imgPath.replace(/^\/+/, '');
            const fullUrl = BASE_URL + '/' + fileName;
            galleryHTML += `
              <div class="gallery-item">
                <img src="${fullUrl}" alt="${fileName}" onerror="this.style.display=\'none\'">
                <div class="file-name" title="${fileName}">${fileName}</div>
                <button class="remove-btn" onclick="removeGalleryImage(${index}, ${imgIdx})">×</button>
              </div>
            `;
          });
        } else {
          galleryHTML += '<p class="text-xs text-gray-600">Нет фото в галерее</p>';
        }
        galleryHTML += '</div></div>';

        div.innerHTML = `
          <div class="flex justify-between mb-4">
            <h3 class="text-xl font-bold text-white">${proj.name || 'Новый проект'}</h3>
            <button onclick="removeProject(${index})" class="text-red-500 text-sm hover:underline">Удалить</button>
          </div>
          <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
            <div>
              <label class="text-xs text-gray-500">Slug (URL)</label>
              <input class="input-dark" data-idx="${index}" data-field="slug" value="${proj.slug || ''}">
            </div>
            <div>
              <label class="text-xs text-gray-500">Название</label>
              <input class="input-dark" data-idx="${index}" data-field="name" value="${proj.name || ''}">
            </div>
            <div>
              <label class="text-xs text-gray-500">Статус</label>
              <select class="input-dark" data-idx="${index}" data-field="status">
                <option value="ready" ${proj.status === 'ready' ? 'selected' : ''}>Готов</option>
                <option value="forsale" ${proj.status === 'forsale' ? 'selected' : ''}>В продаже</option>
                <option value="inprogress" ${proj.status === 'inprogress' ? 'selected' : ''}>В работе</option>
              </select>
            </div>
            <div>
              <label class="text-xs text-gray-500">Цена (₽)</label>
              <input type="number" class="input-dark" data-idx="${index}" data-field="price" value="${proj.price || ''}">
            </div>
            <div>
              <label class="text-xs text-gray-500">Прогресс (%)</label>
              <input type="number" class="input-dark" data-idx="${index}" data-field="progress" value="${proj.progress || ''}">
            </div>
            <div>
              <label class="text-xs text-gray-500">Часы работы</label>
              <input type="number" class="input-dark" data-idx="${index}" data-field="hours" value="${proj.hours || ''}">
            </div>
            <div class="md:col-span-2">
              <label class="text-xs text-gray-500">Краткое описание</label>
              <textarea class="input-dark" rows="2" data-idx="${index}" data-field="description">${proj.description || ''}</textarea>
            </div>
            <div class="md:col-span-2">
              <label class="text-xs text-gray-500">Материалы (через запятую)</label>
              <input class="input-dark" data-idx="${index}" data-field="materials_str" value="${Array.isArray(proj.materials) ? proj.materials.join(', ') : ''}">
            </div>
            <div class="md:col-span-2">
              <label class="text-xs text-gray-500">Обложка</label>
              <input class="input-dark mb-2" data-idx="${index}" data-field="cover" value="${proj.cover || ''}" readonly>
              <input type="file" accept="image/*" onchange="handleImageUpload(this, ${index}, 'cover')" class="text-sm text-gray-400 mt-1">
            </div>
            <div class="md:col-span-2">
              <label class="text-xs text-gray-500">Загрузить фото в галерею (можно несколько сразу)</label>
              <input type="file" accept="image/*" multiple onchange="handleGalleryUpload(this, ${index})" class="text-sm text-gray-400 mt-1">
              ${galleryHTML}
            </div>
          </div>
        `;
        container.appendChild(div);
      });
    }

    function removeGalleryImage(projIdx, imgIdx) {
      if(confirm('Удалить это фото из галереи?')) {
        projectsData[projIdx].gallery.splice(imgIdx, 1);
        renderProjects();
      }
    }

    async function handleGalleryUpload(input, index) {
      const files = Array.from(input.files);
      if (files.length === 0) return;
      
      const statusMsg = document.getElementById('status-msg');
      statusMsg.innerText = `Загрузка ${files.length} фото...`;
      statusMsg.className = "mt-4 text-center text-sm text-yellow-500";

      if (!projectsData[index].gallery) {
        projectsData[index].gallery = [];
      }

      // Загружаем файлы последовательно
      for (let i = 0; i < files.length; i++) {
        const file = files[i];
        statusMsg.innerText = `Загрузка ${i + 1} из ${files.length}: ${file.name}...`;
        
        await new Promise((resolve, reject) => {
          const reader = new FileReader();
          reader.onload = async function(e) {
            try {
              const base64Content = e.target.result.split(',')[1];
              const fileName = `${projectsData[index].slug || 'img'}-gal-${Date.now()}-${i}.${file.name.split('.').pop()}`;
              const path = `images/projects/${fileName}`;

              let sha = null;
              try {
                const checkRes = await fetch(`https://api.github.com/repos/${REPO}/contents/${path}?ref=${BRANCH}`, {
                  headers: { 'Authorization': `Bearer ${token}`, 'Accept': 'application/vnd.github.v3+json' }
                });
                if (checkRes.ok) {
                  const checkData = await checkRes.json();
                  sha = checkData.sha;
                }
              } catch(e) {}

              const payload = {
                message: `Admin: gallery upload ${fileName}`,
                content: base64Content,
                branch: BRANCH
              };
              if (sha) payload.sha = sha;

              const res = await fetch(`https://api.github.com/repos/${REPO}/contents/${path}`, {
                method: 'PUT',
                headers: {
                  'Authorization': `Bearer ${token}`,
                  'Accept': 'application/vnd.github.v3+json',
                  'Content-Type': 'application/json'
                },
                body: JSON.stringify(payload)
              });

              if (res.ok) {
                projectsData[index].gallery.push(`/images/projects/${fileName}`);
                resolve();
              } else {
                reject(new Error(await res.text()));
              }
            } catch (err) {
              reject(err);
            }
          };
          reader.onerror = () => reject(new Error('Failed to read file'));
          reader.readAsDataURL(file);
        });
      }

      statusMsg.innerText = `✅ Загружено ${files.length} фото!`;
      statusMsg.className = "mt-4 text-center text-sm text-green-500";
      renderProjects();
      input.value = ''; // очистка input
    }

    function addNewProject() {
      projectsData.push({
        slug: "new-project",
        name: "Новый проект",
        status: "inprogress",
        price: null,
        progress: 0,
        description: "Описание",
        materials: [],
        hours: 0,
        cover: "",
        gallery: [],
        createdAt: new Date().toISOString(),
        featured: false,
        tags: []
      });
      renderProjects();
    }

    function removeProject(index) {
      if(confirm('Удалить проект?')) {
        projectsData.splice(index, 1);
        renderProjects();
      }
    }

    async function handleImageUpload(input, index, field) {
      const file = input.files[0];
      if (!file) return;
      
      const statusMsg = document.getElementById('status-msg');
      statusMsg.innerText = `Загрузка обложки...`;
      statusMsg.className = "mt-4 text-center text-sm text-yellow-500";

      const reader = new FileReader();
      reader.onload = async function(e) {
        try {
          const base64Content = e.target.result.split(',')[1];
          const fileName = `${projectsData[index].slug || 'cover'}-${Date.now()}.${file.name.split('.').pop()}`;
          const path = `images/projects/${fileName}`;

          let sha = null;
          try {
            const checkRes = await fetch(`https://api.github.com/repos/${REPO}/contents/${path}?ref=${BRANCH}`, {
              headers: { 'Authorization': `Bearer ${token}`, 'Accept': 'application/vnd.github.v3+json' }
            });
            if (checkRes.ok) {
              const checkData = await checkRes.json();
              sha = checkData.sha;
            }
          } catch(e) {}

          const payload = {
            message: `Admin: cover upload ${fileName}`,
            content: base64Content,
            branch: BRANCH
          };
          if (sha) payload.sha = sha;

          const res = await fetch(`https://api.github.com/repos/${REPO}/contents/${path}`, {
            method: 'PUT',
            headers: {
              'Authorization': `Bearer ${token}`,
              'Accept': 'application/vnd.github.v3+json',
              'Content-Type': 'application/json'
            },
            body: JSON.stringify(payload)
          });

          if (res.ok) {
            projectsData[index][field] = `/images/projects/${fileName}`;
            statusMsg.innerText = '✅ Обложка загружена!';
            statusMsg.className = "mt-4 text-center text-sm text-green-500";
            renderProjects();
          } else {
            throw new Error(await res.text());
          }
        } catch (err) {
          statusMsg.innerText = '❌ Ошибка: ' + err.message;
          statusMsg.className = "mt-4 text-center text-sm text-red-500";
        }
      };
      reader.readAsDataURL(file);
    }

    async function saveAllChanges() {
      const statusMsg = document.getElementById('status-msg');
      statusMsg.innerText = 'Сохранение изменений...';
      statusMsg.className = "mt-4 text-center text-sm text-yellow-500";

      document.querySelectorAll('[data-field]').forEach(input => {
        const idx = parseInt(input.dataset.idx);
        const field = input.dataset.field;
        let val = input.value;

        if (field === 'price' || field === 'hours' || field === 'progress') {
          val = val === '' ? null : Number(val);
        }
        
        if (field === 'materials_str') {
          projectsData[idx].materials = val.split(',').map(s => s.trim()).filter(s => s);
        } else if (field !== 'materials_str') {
          projectsData[idx][field] = val;
        }
      });

      try {
        const getRes = await fetch(`https://api.github.com/repos/${REPO}/contents/data/projects.json?ref=${BRANCH}`, {
          headers: { 'Authorization': `Bearer ${token}`, 'Accept': 'application/vnd.github.v3+json' }
        });
        const getData = await getRes.json();

        const jsonString = JSON.stringify(projectsData, null, 2);
        const content = btoa(unescape(encodeURIComponent(jsonString)));
        
        const putRes = await fetch(`https://api.github.com/repos/${REPO}/contents/data/projects.json`, {
          method: 'PUT',
          headers: {
            'Authorization': `Bearer ${token}`,
            'Accept': 'application/vnd.github.v3+json',
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({
            message: 'Admin panel: update projects',
            content: content,
            sha: getData.sha,
            branch: BRANCH
          })
        });

        if (putRes.ok) {
          statusMsg.innerText = '✅ Сохранено! Сайт обновится через 1-2 мин.';
          statusMsg.className = "mt-4 text-center text-sm text-green-500 font-bold";
        } else {
          throw new Error(await putRes.text());
        }
      } catch (err) {
        statusMsg.innerText = '❌ Ошибка: ' + err.message;
        statusMsg.className = "mt-4 text-center text-sm text-red-500";
      }
    }
  </script>
</body>
</html>
